<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link href="style.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
<div class="main-container">
    <div class="sidebar">
        <div class="nav-logo">
            <span class="logo-text">Меню</span>
        </div>

        <div class="nav-divider"></div>

        <a href="/" class="nav-item">Главная</a>
        <a href="#" class="nav-item">Категории</a>
        <a href="#" class="nav-item">Заказы</a>
        <a href="/contacts" class="nav-item">Контакты</a>

        <div style="flex-grow: 1;"></div>

        <div class="nav-divider"></div>
        <div class="mt-auto">Пользователи</div>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div class="form-container">
                    <div class="mb-4">
                        <label class="form-label">Имя</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Почта</label>
                        <input type="email" class="form-control">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Сообщение</label>
                        <textarea class="form-control" rows="3"></textarea>
                        <button type="button" class="btn btn-primary mt-3">Отправить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


</body>
</html>
